{% extends "words/base.html" %}
{% block content %}
<div class="container py-5" style="max-width: 600px;">
    <h1 class="section-title">
        Nowy zestaw
    </h1>

    <form method="post">
        {% csrf_token %}

        <input
            type="text"
            name="name"
            class="form-control form-control-lg mb-4"
            placeholder="Nazwa zestawu"
        >

        <select name="icon" class="form-select form-select-lg mb-4">
            <option value="bi-journal-bookmark|stat-stone">📘 Ogólne</option>
            <option value="bi-airplane|stat-sky">✈️ Podróże</option>
            <option value="bi-briefcase|stat-indigo">💼 Praca</option>
            <option value="bi-mortarboard|stat-purple">🎓 Nauka</option>
            <option value="bi-heart-pulse|stat-red">🏥 Zdrowie</option>
            <option value="bi-controller|stat-fuchsia">🎮 Gry</option>
            <option value="bi-cup-hot|stat-amber">☕ Jedzenie</option>
            <option value="bi-music-note-beamed|stat-pink">🎵 Muzyka</option>
            <option value="bi-film|stat-rose">🎬 Filmy</option>
            <option value="bi-laptop|stat-cyan">💻 IT</option>
            <option value="bi-house-door|stat-emerald">🏠 Dom</option>
            <option value="bi-cart|stat-orange">🛒 Zakupy</option>
            <option value="bi-trophy|stat-lime">🏆 Sport</option>
            <option value="bi-globe-europe-africa|stat-teal">🌍 Kultura</option>
            <option value="bi-cash-coin|stat-green">💰 Finanse</option>
            <option value="bi-palette|stat-violet">🎨 Sztuka</option>
            <option value="bi-car-front|stat-slate">🚗 Transport</option>
            <option value="bi-emoji-smile|stat-yellow">😊 Codzienne</option>
            <option value="bi-chat-dots|stat-blue">💬 Rozmowy</option>
            <option value="bi-lightbulb|stat-brown">💡 Pomysły</option>
        </select>

        <div class="text-center">
            <button type="submit" class="btn study-btn btn-lg px-5">
                Utwórz zestaw
            </button>
        </div>
    </form>
</div>
{% endblock %}
