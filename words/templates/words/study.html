{% extends "words/base.html" %}
{% block content %}

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold">
            {{ word_set.name }}
        </h1>

    </div>

    <div class="card shadow text-center mx-auto mb-4" style="max-width: 600px;">
        <div class="card-body py-5">
            <h2>
                {{ word.text_pl }}
            </h2>
        </div>
    </div>

    <div class="mx-auto" style="max-width: 600px">
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="word_id" value="{{ word.id }}">
            <input
                type="text"
                name="answer"
                class="form-control form-control-lg mb-3"
                placeholder="odpowiedź"
            >

            <div class="text-center d-flex justify-content-center gap-3">
                <button
                    type="submit"
                    class="btn study-btn btn-lg px-5 rounded-pill">
                    Sprawdzam
                </button>

                <button
                    type="submit"
                    class="btn end-btn btn-lg px-5 rounded-pill"
                    name="end_session">
                    Zakończ
                </button>
            </div>
        </form>
    </div>

    <div class="mt-4 text-center">
        <h5>{{ result }}</h5>

        <div class="mt-3">
            <span class="badge bg-success">
                Poprawne: {{ correct_answers }}
            </span>

            <span class="badge bg-danger">
                Błędne: {{ wrong_answers }}
            </span>

        </div>
    </div>
</div>

{% endblock %}
