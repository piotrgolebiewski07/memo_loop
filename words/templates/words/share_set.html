{% extends "words/base.html" %}

{% block content %}

<div class="container py-5" style="max-width: 700px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 text-center">

            <i class="bi bi-share fs-1 text-success"></i>

            <h1 class="h3 mt-3">
                Link do zestawu jest gotowy
            </h1>

            <p class="text-muted">
                Wyślij ten link osobie, której chcesz przekazać zestaw
                „{{ word_set.name }}”.
            </p>

            <div class="input-group mt-4">
                <input
                        type="text"
                        id="share-link"
                        class="form-control"
                        value="{{ share_url }}"
                        readonly
                >

                <button
                        type="button"
                        id="copy-button"
                        class="btn btn-dark"
                        onclick="copyShareLink()"
                >
                    Kopiuj
                </button>
            </div>

            <p class="small text-muted mt-3">
                Link jest ważny przez 24 godziny i można go wykorzystać tylko raz.
            </p>

            <a
                    href="{% url 'my_sets' %}"
                    class="btn end-btn mt-3"
            >
                Wróć do moich zestawów
            </a>

        </div>
    </div>
</div>

<script>
    function copyShareLink() {
        const shareLink = document.getElementById("share-link");
        navigator.clipboard.writeText(shareLink.value);
        const copyButton = document.getElementById("copy-button")
        copyButton.textContent = "Skopiowano!";
        copyButton.disabled = true;
    }
</script>

{% endblock %}
