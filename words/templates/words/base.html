<!DOCTYPE html>

{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo loop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=73">
</head>

<body style="body">

    <nav class="navbar navbar-expand-lg bg-white py-2 shadow">
        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand fw-bold fs-3" href="{% url 'home' %}">
                FiszkoMat
            </a>

            <!-- Menu -->
            <div class="nav-menu d-flex gap-4 align-items-center">

                <a class="nav-link menu-link text-dark" href="{% url 'home' %}">
                    Strona główna
                </a>

                <a class="nav-link menu-link text-dark" href="{% url 'ready_sets' %}">
                    Gotowe zestawy
                </a>

                {% if user.is_authenticated %}
                    <a class="nav-link menu-link text-dark" href="{% url 'my_sets' %}">
                        Moje zestawy
                    </a>
                {% endif %}

            </div>

            <!-- Auth -->
            <div class="nav-auth d-flex gap-3 align-items-center">
                {% if user.is_authenticated %}
                    <span class="nav-user">
                        Witaj, {{ user.username }}
                    </span>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-dark px-4 rounded-pill auth-btn">
                            Wyloguj
                        </button>
                    </form>
                {% else %}
                    <a class="nav-link text-dark" href="{% url 'login' %}">
                        Logowanie
                    </a>

                    <a class="btn btn-dark px-4 rounded-pill auth-btn" href="{% url 'register' %}">
                        Rejestracja
                    </a>
                {% endif %}

            </div>

        </div>
    </nav>

{% block content %}
{% endblock %}

</body>
</html>
