{% extends "words/base.html" %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <h1 class="text-center mb-5">
        Rejestacja
    </h1>

    <form method="post" class="login-form">
        {% csrf_token %}

        {{ form.as_p }}
        <button type="submit" class="btn login-btn mt-3">
            Zarejestruj się
        </button>
    </form>
</div>
{% endblock %}
